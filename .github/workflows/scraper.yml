name: VLESS Scraper and Tester

on:
  schedule:
    - cron: '0 */12 * * *' # هر ۱۲ ساعت
  workflow_dispatch:

jobs:
  run-scraper-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python Requirements
        run: pip install requests beautifulsoup4

      - name: Run Python Scraper
        run: python Scraper.py

      # (اختیاری) اگر بخواهید تست سرعت با دقت ۱۰۰٪ توسط هسته Xray در لینوکس انجام شود، 
      # اینجا می‌توانید ابزار LiteSpeedTest (محبوب‌ترین تستر VLESS در گیتهاب) را دانلود و اجرا کنید
      # و نتایج را به جای پایتون، با آن فیلتر کنید.

      - name: Commit and Push Results
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Update Top 200 Fast VLESS Configs"
          file_pattern: "sub_vless_base64.txt"
