name: Update VLESS Configs

on:
  schedule:
    - cron: '*/30 * * * *' # اجرای خودکار هر ۱۲ ساعت یک‌بار
  workflow_dispatch: # امکان اجرا و تست دستی از تب Actions گیت‌هاب

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Scraper Script
        run: python scraper.py

      - name: Commit and Push Results
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update VLESS subscriptions (Top 200)"
          file_pattern: sub_vless_base64.txt
